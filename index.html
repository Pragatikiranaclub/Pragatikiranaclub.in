<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pragati Kirana Club - Online Grocery Store</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Font Awesome Icons CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 font-sans text-gray-800">

    <!-- Header / Navigation -->
    <header class="bg-green-600 text-white sticky top-0 z-50 shadow-md">
        <div class="container mx-auto px-4 py-3 flex justify-between items-center">
            <h1 class="text-xl font-bold flex items-center gap-2">
                <i class="fas fa-shopping-basket"></i> Pragati Kirana Club
            </h1>
            <button onclick="toggleCart()" class="relative bg-green-700 hover:bg-green-800 px-4 py-2 rounded-full font-medium transition cursor-pointer">
                <i class="fas fa-shopping-cart"></i> Cart 
                <span id="cart-count" class="absolute -top-2 -right-2 bg-yellow-400 text-green-900 text-xs w-5 h-5 rounded-full flex items-center justify-center font-bold">0</span>
            </button>
        </div>
    </header>

    <!-- Hero Banner -->
    <section class="bg-green-100 py-8 text-center px-4">
        <h2 class="text-2xl md:text-3xl font-bold text-green-800">Ghar Baithay Fresh Grocery Mangwayein!</h2>
        <p class="text-gray-600 mt-2 text-sm md:text-base">Aapke local area mein sabse tez aur sasti delivery.</p>
        <div class="mt-4 inline-block bg-white text-green-700 font-semibold px-4 py-1.5 rounded-full shadow-sm text-sm">
            <i class="fas fa-truck"></i> Free Delivery on orders above ₹400
        </div>
    </section>

    <!-- Main Content Area -->
    <main class="container mx-auto px-4 py-8 max-w-6xl">
        <h3 class="text-xl font-bold border-b border-gray-200 pb-2 mb-6"><i class="fas fa-star text-yellow-500"></i> Hamare Popular Products</h3>
        
        <!-- Product Grid -->
        <div id="product-list" class="grid grid-cols-2 md:grid-cols-4 gap-4">
            <!-- Products automatically loaded by JavaScript -->
        </div>
    </main>

    <!-- Shopping Cart Modal Sidebar -->
    <div id="cart-sidebar" class="fixed top-0 right-0 h-full w-full sm:w-96 bg-white shadow-2xl z-50 transform translate-x-full transition-transform duration-300 flex flex-col">
        <div class="bg-green-600 text-white p-4 flex justify-between items-center">
            <h3 class="font-bold text-lg"><i class="fas fa-shopping-cart"></i> Aapka Cart</h3>
            <button onclick="toggleCart()" class="text-white hover:text-gray-200 text-xl cursor-pointer">&times;</button>
        </div>
        
        <!-- Cart Items List -->
        <div id="cart-items" class="flex-1 overflow-y-auto p-4 space-y-4">
            <!-- Dynamically filled -->
        </div>

        <!-- Checkout Form / Footer inside Sidebar -->
        <div class="border-t border-gray-200 p-4 bg-gray-50">
            <div class="flex justify-between items-center font-bold text-lg mb-4 text-gray-700">
                <span>Total Amount:</span>
                <span id="cart-total">₹0</span>
            </div>
            
            <div class="space-y-3">
                <input type="text" id="cust-name" placeholder="Aapka Naam" class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-green-500">
                <textarea id="cust-address" placeholder="Delivery Ka Poora Pata (Address)" rows="2" class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-green-500"></textarea>
                <button onclick="sendToWhatsApp()" class="w-full bg-green-500 hover:bg-green-600 text-white font-bold py-3 rounded shadow transition flex items-center justify-center gap-2 cursor-pointer">
                    <i class="fab fa-whatsapp text-xl"></i> WhatsApp Par Order Bhejein
                </button>
            </div>
        </div>
    </div>

    <!-- JavaScript logic -->
    <script>
        // ✅ APNA UPDATED WHATSAPP NUMBER
        const MY_WHATSAPP_NUMBER = "919768870799"; 

        // Product Catalog Data
        const products = [
            { id: 1, name: "Fresh Aloo (Potato)", price: 30, unit: "1 Kg", img: "https://images.unsplash.com/photo-1518977676601-b53f82aba655?w=200&auto=format&fit=crop&q=60" },
            { id: 2, name: "Fresh Pyaz (Onion)", price: 45, unit: "1 Kg", img: "https://images.unsplash.com/photo-1508747703725-7197771375a0?w=200&auto=format&fit=crop&q=60" },
            { id: 3, name: "Aashirvaad Shudh Chakki Atta", price: 210, unit: "5 Kg", img: "https://images.unsplash.com/photo-1574325131876-a7999d343f72?w=200&auto=format&fit=crop&q=60" },
            { id: 4, name: "Amul Taaza Toned Milk", price: 28, unit: "500 ml", img: "https://images.unsplash.com/photo-1550583724-b2692b85b150?w=200&auto=format&fit=crop&q=60" }
        ];

        let cart = [];

        function renderProducts() {
            const list = document.getElementById('product-list');
            list.innerHTML = products.map(p => `
                <div class="bg-white border border-gray-100 rounded-lg p-3 shadow-sm flex flex-col justify-between hover:shadow-md transition">
                    <img src="${p.img}" alt="${p.name}" class="w-full h-28 object-cover rounded-md mb-2 bg-gray-100">
                    <div>
                        <h4 class="font-semibold text-sm md:text-base leading-tight">${p.name}</h4>
                        <p class="text-xs text-gray-500 mt-0.5">${p.unit}</p>
                    </div>
                    <div class="mt-3 flex justify-between items-center">
                        <span class="font-bold text-green-700">₹${p.price}</span>
                        <button onclick="addToCart(${p.id})" class="bg-green-600 hover:bg-green-700 text-white px-3 py-1 rounded text-xs font-semibold cursor-pointer transition">+ Add</button>
                    </div>
                </div>
            `).join('');
        }

        function addToCart(id) {
            const item = products.find(p => p.id === id);
            const inCart = cart.find(c => c.id === id);
            if (inCart) {
                inCart.qty++;
            } else {
                cart.push({ ...item, qty: 1 });
            }
            updateCartUI();
        }

        function changeQty(id, change) {
            const inCart = cart.find(c => c.id === id);
            if (inCart) {
                inCart.qty += change;
                if (inCart.qty <= 0) {
                    cart = cart.filter(c => c.id !== id);
                }
            }
            updateCartUI();
        }

        function updateCartUI() {
            document.getElementById('cart-count').innerText = cart.reduce((acc, c) => acc + c.qty, 0);
            const total = cart.reduce((acc, c) => acc + (c.price * c.qty), 0);
            document.getElementById('cart-total').innerText = '₹' + total;

            const itemsContainer = document.getElementById('cart-items');
            if (cart.length === 0) {
                itemsContainer.innerHTML = `<p class="text-gray-400 text-center mt-8 text-sm">Aapka cart khali hai.</p>`;
                return;
            }

            itemsContainer.innerHTML = cart.map(c => `
                <div class="flex justify-between items-center border-b border-gray-100 pb-2">
                    <div>
                        <h5 class="font-semibold text-sm">${c.name}</h5>
                        <p class="text-xs text-gray-500">₹${c.price} x ${c.qty}</p>
                    </div>
                    <div class="flex items-center gap-2">
                        <button onclick="changeQty(${c.id}, -1)" class="bg-gray-200 px-2 py-0.5 text-xs rounded font-bold cursor-pointer">-</button>
                        <span class="text-sm font-bold w-4 text-center">${c.qty}</span>
                        <button onclick="changeQty(${c.id}, 1)" class="bg-gray-200 px-2 py-0.5 text-xs rounded font-bold cursor-pointer">+</button>
                    </div>
                </div>
            `).join('');
        }

        function toggleCart() {
            const sidebar = document.getElementById('cart-sidebar');
            sidebar.classList.toggle('translate-x-full');
        }

        function sendToWhatsApp() {
            const name = document.getElementById('cust-name').value.trim();
            const address = document.getElementById('cust-address').value.trim();

            if (!name || !address) {
                alert("Kripya apna Naam aur Delivery Address bharein!");
                return;
            }
            if (cart.length === 0) {
                alert("Aapka cart khali hai!");
                return;
            }

            let message = `🛒 *Naya Order - Pragati Kirana Club*\n\n`;
            message += `👤 *Customer:* ${name}\n`;
            message += `📍 *Address:* ${address}\n\n`;
            message += `📦 *Items List:*\n`;

            let total = 0;
            cart.forEach(c => {
                const subtotal = c.price * c.qty;
                total += subtotal;
                message += `- ${c.name} (${c.unit}) x ${c.qty} = ₹${subtotal}\n`;
            });

            message += `\n💰 *Total Bill Amount:* ₹${total}`;
            
            const encodedMessage = encodeURIComponent(message);
            window.open(`https://wa.me/${MY_WHATSAPP_NUMBER}?text=${encodedMessage}`, '_blank');
        }

        window.onload = renderProducts;
    </script>
</body>
</html>
